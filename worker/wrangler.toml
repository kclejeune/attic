name = "attic-worker"
main = "src/entry.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Garbage collection moved to the attic-admin worker (TypeScript, closure-aware
# retention); its nightly cron owns GC now. No cron here — the legacy Rust GC
# is not closure-aware and must not run.
[triggers]
crons = []

[build]
command = "npm install && cargo install -q worker-build@0.1.14 && worker-build --release"

# R2 bucket for storing NARs and chunks
[[r2_buckets]]
binding = "CACHE_BUCKET"
bucket_name = "attic-cache"

# D1 database (preferred - native, faster)
# To set up D1:
#   1. Create database: wrangler d1 create attic
#   2. Copy the database_id from output below
#   3. Initialize schema: wrangler d1 execute attic --file=src/database/schema.sql
[[d1_databases]]
binding = "ATTIC_DB"
database_name = "attic"
database_id = "872ceec3-5438-4069-b3fa-69fbb66dd011"  # Replace with actual ID from `wrangler d1 create attic`

# Environment variables
[vars]
# Base URL of the admin app, for CLI login discovery (/_api/v1/auth-config).
CLI_AUTH_BASE_URL = "https://app.cache.kclj.io"
# Set these for Turso database access
# TURSO_URL = "libsql://your-db.turso.io"

# Secrets (set via `wrangler secret put`)
# - TURSO_AUTH_TOKEN: Turso database auth token
# - JWT_HS256_SECRET_BASE64: Base64-encoded HMAC secret for JWT validation
# - JWT_RS256_PUBKEY_BASE64: Base64-encoded RSA public key for JWT validation (alternative)

[dev]
port = 8787
local_protocol = "http"
