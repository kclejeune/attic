[package]
name = "attic-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
attic = { path = "../attic", default-features = false, features = ["chunking", "io"] }
attic-token = { path = "../token" }

# Cloudflare Worker dependencies
worker = { version = "0.4", features = ["d1"] }
console_error_panic_hook = "0.1"

# WASM-compatible async
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "Headers",
    "Request",
    "RequestInit",
    "Response",
    "Window",
] }
serde-wasm-bindgen = "0.6"

# Core dependencies
bytes = "1.10"
chrono = { version = "0.4", default-features = false, features = ["serde", "wasmbind"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = { version = "0.2", features = ["js"] }

# Compression (WASM-compatible)
ruzstd = "0.8"

[profile.release]
opt-level = "s"
lto = true
