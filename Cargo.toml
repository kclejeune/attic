[workspace]
resolver = "2"

# The worker crate is a wasm cdylib deployed independently via worker-build and
# is intentionally NOT a workspace member: worker-build pins wasm-bindgen-cli
# 0.2.105, while the client's reqwest 0.13 forces the shared workspace lockfile
# to wasm-bindgen 0.2.108. Keeping the worker out of the workspace gives it its
# own lockfile so both can build.
members = [
	"attic",
	"client",
	"server",
	"token",
]
exclude = [
	"worker",
]
